name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test

      - name: Install Playwright browsers
        timeout-minutes: 20
        run: |
          for attempt in 1 2 3; do
            if timeout 480 pnpm exec playwright install --with-deps chromium webkit; then
              exit 0
            fi
            echo "Tentativa $attempt falhou, repetindo..."
          done
          exit 1

      - name: E2E tests
        run: pnpm test:e2e
